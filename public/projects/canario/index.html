<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Canario</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="view view-top">
		<div class="logo-container">
			<h1 class="brand fade-in" data-fade-delay="100">CANARIO</h1>
		</div>
	</div>
	<div class="view view-bottom">
		<div class="content-container">
			<div class="text-container">
				<p class="text-item fade-in" data-fade-delay="700">Beautiful ideas deserve space to breathe.</p>
				<p class="text-item fade-in" data-fade-delay="900">A calm digital experience inspired by the sky.</p>
				<p class="text-item fade-in" data-fade-delay="1100">Enter the wait list</p>
			</div>
			<div class="button-container fade-in" data-fade-delay="1300">
				<div class="input-group">
					<input id="emailInput" type="email" name="email" placeholder="Enter your email" class="email-input">
					<button id="submitButton" class="submit-button">SUBMIT</button>
				</div>
				<div id="feedback" class="feedback"></div>
			</div>
		</div>
		<div class="footer-links">
			<a href="../../index.html" class="footer-link fade-in" data-fade-delay="1500">About Me</a>
			<a href="terms.html" class="footer-link fade-in" data-fade-delay="1700">Terms and Conditions</a>
			<a href="privacy.html" class="footer-link fade-in" data-fade-delay="1900">Privacy Policy</a>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const fadeElements = document.querySelectorAll('.fade-in');
			fadeElements.forEach((element) => {
				const delay = parseInt(element.getAttribute('data-fade-delay')) || 0;
				setTimeout(() => {
					element.classList.add('visible');
				}, delay);
			});
		});

		document.getElementById('submitButton').addEventListener('click', async function () {
			const emailInput = document.getElementById('emailInput');
			const feedback = document.getElementById('feedback');
			const email = emailInput.value.trim();

			feedback.className = 'feedback';
			feedback.textContent = '';

			if (!email) {
				feedback.className = 'feedback error';
				feedback.textContent = 'Please enter your email address';
				return;
			}

			const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			if (!emailRegex.test(email)) {
				feedback.className = 'feedback error';
				feedback.textContent = 'Please enter a valid email address';
				return;
			}

			const button = document.getElementById('submitButton');
			const originalText = button.textContent;
			button.textContent = 'SENDING...';
			button.disabled = true;

			try {
				const formData = new FormData();
				formData.append('email', 'tigulima@gmail.com');
				formData.append('subject', 'New Waitlist Sign Up - Canario');
				formData.append('message', `${email} has interest in Canario.`);
				formData.append('_captcha', 'false');

				const response = await fetch('https://formsubmit.co/tigulima@gmail.com', {
					method: 'POST',
					body: formData,
					headers: {
						Accept: 'application/json'
					}
				});

				if (response.ok) {
					feedback.className = 'feedback success';
					feedback.textContent = 'Thank you! You have been added to the waitlist.';
					emailInput.value = '';
				} else {
					throw new Error('Failed to submit');
				}
			} catch (error) {
				feedback.className = 'feedback error';
				feedback.textContent = 'Oops! Something went wrong. Please try again.';
			} finally {
				button.textContent = originalText;
				button.disabled = false;
			}
		});

		document.getElementById('emailInput').addEventListener('keypress', function (e) {
			if (e.key === 'Enter') {
				document.getElementById('submitButton').click();
			}
		});
	</script>
</body>
</html>
